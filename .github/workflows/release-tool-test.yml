name: Release Tool Test

# This workflow is the only place cmd/release is tested: cmd/ci leaves it out of the Test workflow's unit-cli group, and
# Test, Build and Docker skip changes confined to cmd/release. It also covers documentation/misc/RELEASE_ISSUE_TEMPLATE.md,
# which the release CLI parses as a Go template but which those workflows treat as skippable Markdown.
on:
  pull_request:
    paths:
      - 'cmd/release/**'
      - 'documentation/misc/RELEASE_ISSUE_TEMPLATE.md'
      - '.github/workflows/release-tool-test.yml'
  push:
    branches:
      - master
      - release/*
    paths:
      - 'cmd/release/**'
      - 'documentation/misc/RELEASE_ISSUE_TEMPLATE.md'
      - '.github/workflows/release-tool-test.yml'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Release Tool Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-go
      - run: go test ./cmd/release/...
