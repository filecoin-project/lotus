name: Docker

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master
      - release/v*
      - release/miner/v*
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the Docker image'
        required: false
        default: 'false'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  docker:
    name: Docker (${{ matrix.image }} / ${{ matrix.network }} / ${{ matrix.platform.arch }}) [publish=${{ github.event.inputs.publish == 'true' || github.event_name != 'pull_request' }}]
    runs-on: ${{ matrix.platform.runner }}
    if: github.repository_owner == 'filecoin-project'
    strategy:
      fail-fast: false
      matrix:
        image:
          - lotus-all-in-one
        network:
          - mainnet
          - butterflynet
          - calibnet
          - debug
          - 2k
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        include:
          - image: lotus
            network: mainnet
            platform:
              arch: amd64
              runner: ubuntu-latest
          - image: lotus
            network: mainnet
            platform:
              arch: arm64
              runner: ubuntu-24.04-arm
    env:
      PUBLISH: ${{ github.event.inputs.publish == 'true' || github.event_name != 'pull_request' }}
    steps:
      - &channel
        id: channel
        env:
          IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          IS_RC: ${{ contains(github.ref, '-rc') }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          channel=''
          if [[ "$IS_MASTER" == 'true' ]]; then
            if [[ "$IS_SCHEDULED" == 'true' ]]; then
              channel=nightly
            else
              channel=master
            fi
          elif [[ "$IS_TAG" == 'true' ]]; then
            if [[ "$IS_RC" == 'true' ]]; then
              channel=candidate
            else
              channel=stable
            fi
          fi
          echo "channel=$channel" | tee -a $GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - &git
        id: git
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          ref="${ref#refs/tags/}"
          sha="$(git rev-parse --short HEAD)"
          echo "ref=$ref" | tee -a "$GITHUB_OUTPUT"
          echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - &docker-meta
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: filecoin/${{ matrix.image }}
          tags: |
            type=raw,enable=${{ steps.channel.outputs.channel != '' }},value=${{ steps.channel.outputs.channel }}
            type=raw,enable=${{ startsWith(github.ref, 'refs/tags/') }},value=${{ steps.git.outputs.ref }}
            type=raw,value=${{ steps.git.outputs.sha }}
          flavor: |
            latest=false
            suffix=${{ matrix.network != 'mainnet' && format('-{0}', matrix.network) || '' }}
      - if: env.PUBLISH == 'true'
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=filecoin/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH == 'true' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.network != 'mainnet' && format('GOFLAGS=-tags={0}', matrix.network) || ''}}
      - name: Export image digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - name: Upload image digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.image }}-${{ matrix.network }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish Docker (${{ matrix.image }} / ${{ matrix.network }})
    needs: docker
    if: github.event.inputs.publish == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - lotus-all-in-one
        network:
          - mainnet
          - butterflynet
          - calibnet
          - debug
          - 2k
        include:
          - image: lotus
            network: mainnet
    env:
      IMAGE: filecoin/${{ matrix.image }}
    steps:
      - *channel
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *git
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digests-${{ matrix.image }}-${{ matrix.network }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - *docker-meta
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
            sources+=("$IMAGE@$digest")
          done

          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          [[ "${#tag_args[@]}" -gt 0 ]] || exit 1

          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/manifest.json"
          jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort | unique == ["amd64", "arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
