name: Docker

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master
      - release/v*
      - release/miner/v*
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the Docker image'
        required: false
        default: 'false'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  docker:
    name: Docker (${{ matrix.image }} / ${{ matrix.network }} / ${{ matrix.platform.arch }}) [publish=${{ github.event.inputs.publish == 'true' || github.event_name != 'pull_request' }}]
    runs-on: ${{ matrix.platform.runner }}
    if: github.repository_owner == 'filecoin-project'
    strategy:
      fail-fast: false
      matrix:
        image:
          - lotus-all-in-one
        network:
          - mainnet
          - butterflynet
          - calibnet
          - debug
          - 2k
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        include:
          - image: lotus
            network: mainnet
            platform:
              arch: amd64
              runner: ubuntu-latest
          - image: lotus
            network: mainnet
            platform:
              arch: arm64
              runner: ubuntu-24.04-arm
    env:
      PUBLISH: ${{ github.event.inputs.publish == 'true' || github.event_name != 'pull_request' }}
      BUILD_TAG: &build-tag build-${{ github.run_id }}-${{ matrix.network }}
    steps:
      - &channel
        id: channel
        env:
          IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          IS_RC: ${{ contains(github.ref, '-rc') }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          channel=''
          if [[ "$IS_MASTER" == 'true' ]]; then
            if [[ "$IS_SCHEDULED" == 'true' ]]; then
              channel=nightly
            else
              channel=master
            fi
          elif [[ "$IS_TAG" == 'true' ]]; then
            if [[ "$IS_RC" == 'true' ]]; then
              channel=candidate
            else
              channel=stable
            fi
          fi
          echo "channel=$channel" | tee -a $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - &git
        id: git
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          ref="${ref#refs/tags/}"
          sha="$(git rev-parse --short HEAD)"
          echo "ref=$ref" | tee -a "$GITHUB_OUTPUT"
          echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - &docker-meta
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: filecoin/${{ matrix.image }}
          tags: |
            type=raw,enable=${{ steps.channel.outputs.channel != '' }},value=${{ steps.channel.outputs.channel }}
            type=raw,enable=${{ startsWith(github.ref, 'refs/tags/') }},value=${{ steps.git.outputs.ref }}
            type=raw,value=${{ steps.git.outputs.sha }}
          flavor: |
            latest=false
            suffix=${{ matrix.network != 'mainnet' && format('-{0}', matrix.network) || '' }}
      - if: env.PUBLISH == 'true'
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: filecoin/${{ matrix.image }}:${{ env.BUILD_TAG }}-${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.network != 'mainnet' && format('GOFLAGS=-tags={0}', matrix.network) || ''}}

  publish:
    name: Publish Docker (${{ matrix.image }} / ${{ matrix.network }})
    needs: docker
    if: github.event.inputs.publish == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - lotus-all-in-one
        network:
          - mainnet
          - butterflynet
          - calibnet
          - debug
          - 2k
        include:
          - image: lotus
            network: mainnet
    env:
      BUILD_TAG: *build-tag
      IMAGE: filecoin/${{ matrix.image }}
    steps:
      - *channel
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - *git
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - *docker-meta
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          sources=("$IMAGE:$BUILD_TAG-amd64" "$IMAGE:$BUILD_TAG-arm64")

          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          [[ "${#tag_args[@]}" -gt 0 ]] || exit 1

          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/manifest.json"
          jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort | unique == ["amd64", "arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Remove temporary architecture tags
        # A cleanup failure must not invalidate a successfully published image.
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE_TAG" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort | unique == ["amd64", "arm64"]
          '

          hub_token="$(jq -n '{identifier: env.DOCKERHUB_USERNAME, secret: env.DOCKERHUB_TOKEN}' |
            curl -fsS -H 'Content-Type: application/json' --data-binary @- \
              https://hub.docker.com/v2/auth/token |
            jq -er '.access_token // empty')"
          echo "::add-mask::$hub_token"
          for arch in amd64 arm64; do
            curl -fsS -X DELETE -H "Authorization: Bearer $hub_token" \
              "https://hub.docker.com/v2/namespaces/filecoin/repositories/${IMAGE#*/}/tags/$BUILD_TAG-$arch/"
          done
