name: Check

on:
  pull_request:
  push:
    branches:
      - master
      - release/*
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-check:
    name: Check (precheck)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_checks: ${{ steps.changes.outputs.nonMarkdownFiles == 'false' }}
      run_actionlint: ${{ steps.changes.outputs.actions == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            nonMarkdownFiles:
              - '!**/*.md'
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actionlint.yaml'
              - 'Makefile'
  check-gen:
    name: Check (gen-check)
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.skip_checks != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - uses: ./.github/actions/install-system-dependencies
      - uses: ./.github/actions/install-go
      - uses: ./.github/actions/make-deps
      - run: make gen
      - run: git diff --exit-code
      - run: make docsgen-cli
      - run: git diff --exit-code
  check-lint:
    name: Check (lint-all)
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.skip_checks != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - uses: ./.github/actions/install-system-dependencies
      - uses: ./.github/actions/install-go
      - uses: ./.github/actions/make-deps
      - run: make lint
  check-fmt:
    name: Check (gofmt)
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.skip_checks != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - uses: ./.github/actions/install-go
      - run: go fmt ./...
      - run: git diff --exit-code
  check-mod-tidy:
    name: Check (mod-tidy-check)
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.skip_checks != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - uses: ./.github/actions/install-go
      - run: go mod tidy -v
      - run: git diff --exit-code
  check-actionlint:
    name: Check (actionlint)
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.run_actionlint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-go
      - run: make actionlint
  post-check:
    name: Check (postcheck)
    needs: [check-gen, check-lint, check-fmt, check-mod-tidy, check-actionlint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          failure: ${{ needs.check-gen.result == 'failure' || needs.check-lint.result == 'failure' || needs.check-fmt.result == 'failure' || needs.check-mod-tidy.result == 'failure' || needs.check-actionlint.result == 'failure' }}
        run: |
          if [[ "$failure" == "true" ]]; then
            echo "Some checks failed, see the workflow results for more information."
            exit 1
          fi
        shell: bash
