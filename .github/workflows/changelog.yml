name: Changelog

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'

jobs:
  changelog:
    if: contains(github.event.pull_request.body, '[skip changelog]') == false &&
        contains(github.event.pull_request.labels.*.name, 'skip/changelog') == false &&
        github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Changelog
    steps:
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          ENDPOINT: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CONVENTIONS: '[changelog management conventions](https://github.com/filecoin-project/lotus/blob/master/CONTRIBUTING.md#changelog-management)'
        run: |
          changelog="$(gh api --paginate "$ENDPOINT" --jq '.[] | select(.filename == "CHANGELOG.md")')"
          if [[ -z "$changelog" ]]; then
            echo "::error::CHANGELOG.md was not modified in this PR. Please do one of the options in $CONVENTIONS"
            exit 1
          fi
          # Release and backport PRs into release branches carry entries from other PRs, so only PRs into master must link to themselves.
          if [[ "$BASE_REF" != master ]]; then
            exit 0
          fi
          added="$(jq -r '.patch // ""' <<<"$changelog" | grep '^+' || true)"
          if ! grep -qE "github\.com/filecoin-project/lotus/pull/$PR_NUMBER([^0-9]|\$)" <<<"$added"; then
            found="$(grep -oE 'github\.com/filecoin-project/lotus/pull/[0-9]+' <<<"$added" | sort -u | paste -sd ' ' - || true)"
            echo "::error::No line added to CHANGELOG.md links to this PR (https://github.com/filecoin-project/lotus/pull/$PR_NUMBER). Added PR links: ${found:-none}. Please fix the entry or do one of the options in $CONVENTIONS"
            exit 1
          fi
