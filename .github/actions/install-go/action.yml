name: Install Go
description: Install Go for Filecoin Lotus

inputs:
  working-directory:
    description: Specifies the working directory where the command is run.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: stable
        cache: false
    - id: go-mod
      uses: ipdxco/unified-github-workflows/.github/actions/read-go-mod@d9b156f4be9fae6843707f5e5cda2fb079f821ac # v1.0.45
      with:
        working-directory: ${{ inputs.working-directory || github.workspace }}
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ fromJSON(steps.go-mod.outputs.json).Go }}
        cache: false
