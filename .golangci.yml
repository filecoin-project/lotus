version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - gosec
    - govet
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused

  exclusions:
    # Preserve the previous skip-dirs behavior (v1 'skip-dirs').
    # We don't want to skip builtin/
    paths:
      - vendor$
      - testdata$
      - examples$
    rules:
      # gosec
      - linters:
          - gosec
        text: "^G101: Potential hardcoded credentials"
      - linters:
          - gosec
        text: "^G108: Profiling endpoint is automatically exposed on /debug/pprof"
      - linters:
          - gosec
        text: "^G115: integer overflow conversion u?int(8|32|64)? -> u?int(8|32|64)?"
      - linters:
          - gosec
        text: "^G204: Subprocess launched with (variable|a potential tainted input or cmd arguments)"
      - linters:
          - gosec
        text: "^G301: Expect directory permissions to be 0750 or less"
      - linters:
          - gosec
        text: "^G302: Expect file permissions to be 0600 or less"
      - linters:
          - gosec
        text: "^G304: Potential file inclusion via variable"
      - linters:
          - gosec
        text: "^G306: Expect WriteFile permissions to be 0600 or less"
      - linters:
          - gosec
        text: "^G404: Use of weak random number generator"
      # staticcheck
      - linters:
          - staticcheck
        text: "^SA1019: xerrors.* is deprecated: As of Go 1.13, use errors"
      # revive
      - linters:
          - revive
        text: "^blank-imports: a blank import should be only in a main or test package, or have a comment justifying it"
      - linters:
          - revive
        text: "^dot-imports: should not use dot imports"
      - linters:
          - revive
        text: "^exported: (func|type) name will be used as [^\\s]+ by other packages, and that stutters; consider calling this \\w+"
      - linters:
          - revive
        text: "^exported: comment on exported (const|var) [^\\s]+ should be of the form \"\\w+ ...\""
      - linters:
          - revive
        text: "^exported: exported (const|function|method|type|var) [^\\s]+ should have comment (\\(or a comment on this block\\) )?or be unexported"
      - linters:
          - revive
        text: "^indent-error-flow: if block ends with a return statement, so drop this else and outdent its block \\(move short variable declaration to its own line if necessary\\)"
      - linters:
          - revive
        text: "^package-comments: package comment should be of the form \"Package \\w+ ...\""
      - linters:
          - revive
        text: "^package-comments: should have a package comment"
      - linters:
          - revive
        text: "^unexported-return: exported func \\w+ returns unexported type [^\\s]+, which can be annoying to use"
      - linters:
          - revive
        text: "^unused-parameter: parameter '\\w+' seems to be unused, consider removing or renaming it as _"
      - linters:
          - revive
        text: "^var-naming: (const|func|type|var|struct field|(method|func|interface method) parameter) [A-Z]\\w+ should be"
      - linters:
          - revive
        text: "^var-naming: (method|range var) \\w*(Api|Http|Id|Rpc|Url)[^\\s]* should be \\w*(API|HTTP|ID|RPC|URL)"
      - linters:
          - revive
        text: "^var-naming: don't use underscores in Go names"
      - linters:
          - revive
        text: "^var-naming: don't use ALL_CAPS in Go names; use CamelCase"
      - linters:
          - revive
        text: "^redefines-builtin-id: redefinition of the built-in (function|type) (max|min|cap|recover|new|error)"
      # gosec: test files and generators carry deliberately loose patterns (preserved
      # from the v1 exclude-rules below).
      - path: (_test\.go|chain/vectors/gen/.*|cmd/lotus-bench/.*)
        linters:
          - gosec
      # govet 'inline' (new in v2's govet): inlining suggestions on reflect.Ptr
      # constants in docgen/invoker; no v1 baseline.
      - linters:
          - govet
        text: "^inline:"
      # staticcheck: remaining v2-version-bump classes — SA1019 (deprecation notices
      # beyond the xerrors one v1 excluded: go/parser.ParseDir in docgen, dup-import
      # shims), ST1005 (error-string caps), ST1019 (per-version actor duplicate
      # imports — structural to the actors-version pattern), QF1002/QF1009 misc
      # quick-fixes. Fix-as-you-touch; excluded for parity.
      - linters:
          - staticcheck
        text: "^(SA1019|ST1005|ST1019|QF1002|QF1009):"
      # Findings from checks that are new or tightened in v2 and have no v1 baseline.
      # Each is a real follow-up, excluded here so the migration preserves finding
      # parity with v1 (see issue #13903):
      # - G115: v2 now flags plain int->byte; the 4 hits are provably-safe length
      #   prefixes (len(hash)<=64, len(key)<=255, len(data)<=55 guarded).
      # - G117/G118/G602: new-in-v2 gosec checks (secret-in-struct on the wallet
      #   export commands is the tool's intended purpose; G118/G602 need case-by-case
      #   review).
      # - G703/G704: taint-analysis checks; the path-traversal/SSRF hits in
      #   storage/paths are worth a dedicated security pass, not a drive-by fix.
      - linters:
          - gosec
        text: "^(G115|G117|G118|G602|G703|G704):"
      # staticcheck quick-fix/style classes from the v2 staticcheck version bump
      # (S1000/S1002/S1005/S1008/S1016/S1023/S1025/S1030/S1039/QF1001/QF1003/QF1004/
      # QF1006/QF1007/QF1008/QF1010/QF1011/QF1012/ST1015/ST1019/ST1023): style
      # modernizations with no v1 baseline, not defects. Fix-as-you-touch; excluded for
      # finding parity with v1.
      - linters:
          - staticcheck
        text: "^(S1000|S1002|S1005|S1008|S1016|S1023|S1025|S1030|S1039|QF1001|QF1003|QF1004|QF1006|QF1007|QF1008|QF1010|QF1011|QF1012|ST1015|ST1019|ST1023)[:(]"
      # revive var-naming on camelCase ids (dealId -> dealID etc.): interface-method
      # parameter renames are public-API breaking for API consumers; tracked as a
      # separate API-hygiene change, excluded for parity. The v1 config effectively
      # ran revive with none of these rules firing (its exclusion list predates the
      # current rule texts), so families without a v1 baseline are excluded wholesale.
      - linters:
          - revive
        text: "^(var-naming|exported|indent-error-flow|package-comments|unexported-return|unused-parameter|redefines-builtin-id|blank-imports|dot-imports):"
      # unused: per-version actor shims (verifiedClients & co.) are kept symmetric
      # across all 19 actor versions by convention; removing them is an API-surface
      # decision for the actors codegen owner.
      - linters:
          - unused
        text: "is unused"

formatters:
  enable:
    - gofmt
    - goimports
